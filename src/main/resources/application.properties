spring.application.name=motiva-api
server.port=${SERVER_PORT:8080}

# Oracle FIAP. Configure ORACLE_USER e ORACLE_PASSWORD no ambiente; não coloque senhas aqui.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas são as já existentes da Sprint 3; Hibernate somente valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=never
